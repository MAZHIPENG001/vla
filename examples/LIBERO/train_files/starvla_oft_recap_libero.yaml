# Advantage-conditioned OFT policy. Training examples require boolean advantage_indicator.
# Critic settings remain in recap; this policy does not load the critic.
run_id: starvla
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: '0.21'
framework:
  name: QwenOFTRecap
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    action_model_type: MLP
  advantage_conditioning:
    dropout_probability: 0.3
    sft_positive: false
    inference_condition: positive
recap:
  name: QwenRecap
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-2B-Instruct
    attn_implementation: sdpa
  value_model:
    num_bins: 201
    value_min: -1.0
    value_max: 0.0
    freeze_backbone: false
    checkpoint: null
  advantage:
    mode: posttrain
    n_steps: 50
    positive_fraction: null
    dropout_probability: 0.3
    prediction_batch_size: 8
    thresholds: {}
  # Explicit outcomes; unknown or truncated episodes must not be treated as successes.
  data:
    success_source: manifest  # manifest | column | all_success (known successful demos only)
    outcome_path: meta/recap_episodes.jsonl
    success_column: success
    task_column: task_index
    truncated_column: null
    intervention_column: null
  reward:
    failure_penalty: null  # REQUIRED: choose the task's failure cost; no universal paper value.
    normalization: null  # REQUIRED: fixed task divisor keeping all returns in [-1, 0].
    task_overrides: {}  # "dataset_name:task_id": {failure_penalty: ..., normalization: ...}
  training:
    output_dir: playground/Checkpoints/recap_value
    batch_size: 2
    num_workers: 0
    max_steps: 10000
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-5
    weight_decay: 0.01
    max_grad_norm: 1.0
    validation_fraction: 0.1
    eval_interval: 500
    save_interval: 1000
    logging_steps: 10
    gradient_checkpointing: true
  labeling:
    output_dir: playground/Checkpoints/recap_labels
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: pyav
    # One label file per dataset; missing labels fail instead of resampling.
    advantage_labels:
      source: sidecar  # parquet: read existing label columns; none: legacy/SFT.
      path: meta/advantage_labels.jsonl
trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
