[project]
name = "vla"
version = "0.1.0"
description = "Vision-language-action training and LeRobot dataset tools"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vla*", "deployment*", "data_process*"]
exclude = ["*.tests*", "data_process.output*", "data_process.images*", "data_process.web*"]

[tool.setuptools.package-data]
vla = ["config/**/*.yaml"]
data_process = ["web/*"]

[tool.uv]
managed = false

# Build CUDA extensions with the torch already installed in the active environment.
[tool.uv.pip]
no-build-isolation-package = ["pytorch3d", "deepspeed", "flash-attn"]
